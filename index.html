<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Firoz Mahmud — Senior Software Engineer. Backend systems, LLM pipelines, and cloud platforms. Open to Forward Deployed AI, backend, and cloud roles."
    />
    <meta name="author" content="Firoz Mahmud" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400..600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Flash-prevention: Inter before CSS bundle paints */
      html,
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
    </style>
    <title>Firoz Mahmud — Senior Software Engineer</title>
    <script>
      (function () {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);
        if (window.location.hash) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      })();
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = 'light';

        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
