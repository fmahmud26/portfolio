<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Firoz Mahmud — Senior Software Engineer. Seven years building backend systems, LLM pipelines, and cloud-native platforms on AWS, GCP, and Azure. Open to Forward Deployed AI, backend, and cloud roles."
    />
    <meta name="author" content="Firoz Mahmud" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap"
      rel="stylesheet"
    />
    <title>Firoz Mahmud — Senior Software Engineer</title>
    <script>
      (function () {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = 'light';

        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
